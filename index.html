<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#6C5CE7" />
<meta name="description" content="Macaron - a clean local bookmark manager" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Macaron" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icon-512.png" />
<link rel="apple-touch-icon" href="icon-512.png" />
<link rel="apple-touch-icon" sizes="192x192" href="icon-512.png" />
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<title>Macaron</title>
<style>
  /* ===== 主题变量 ===== */
  :root{
    --bg:         #F7F8FA;
    --card:       #FFFFFF;
    --ink:        #2D3142;
    --ink-soft:   #7A7F90;
    --line:       #E8EAED;
    --primary:    #6C5CE7;
    --primary-2:  #A29BFE;
    --accent:     #00B894;
    --accent-2:   #55EFC4;
    --warning:    #FDCB6E;
    --warning-2:  #FFEAA7;
    --danger:     #FF7675;
    --danger-2:   #FFB8B7;
    --title:      #6C5CE7;
    --shadow:     rgba(45,49,66,.08);
    --shadow-lg:  rgba(45,49,66,.12);
  }
  body.dark{
    --bg:         #1A1B26;
    --card:       #242635;
    --ink:        #E8EAF0;
    --ink-soft:   #9BA0B3;
    --line:       #36394A;
    --shadow:     rgba(0,0,0,.35);
    --shadow-lg:  rgba(0,0,0,.5);
  }
  body.dark .add-card, body.dark .item, body.dark .search-box, body.dark .modal-content{ background:var(--card); }
  body.dark .row > input, body.dark .row > textarea, body.dark .copy-input-wrap, body.dark .edit-name-input{ background:#1E2030; color:var(--ink); }
  body.dark .copy-item, body.dark .link-preview{ background:#1E2030; }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:"Inter","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100%; padding-bottom:60px;
    transition:background .3s, color .3s;
    -webkit-font-smoothing:antialiased;
  }
  .font-script{ font-family:"Pacifico",cursive; }

  /* ===== SVG 图标 ===== */
  .icon{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .icon-sm{ width:16px; height:16px; }
  .icon-lg{ width:22px; height:22px; }

  /* ===== 顶部 ===== */
  header{
    position:relative; text-align:center;
    padding:22px 16px 14px;
    background:var(--card);
    border-bottom:1px solid var(--line);
  }
  header h1{ font-size:30px; font-weight:400; color:var(--title); letter-spacing:1px; transition:color .3s; }
  header p{ font-size:12px; color:var(--ink-soft); margin-top:2px; letter-spacing:.5px; }
  .top-btn{
    position:absolute; top:16px; width:40px; height:40px; border-radius:12px;
    border:none; background:transparent; color:var(--ink-soft);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .2s, color .2s;
  }
  .top-btn:hover{ background:var(--bg); color:var(--ink); }
  .top-left{ left:12px; }
  .top-right{ right:12px; }

  /* 下拉菜单 */
  .dropdown{
    position:absolute; top:60px; left:12px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 8px 24px var(--shadow-lg);
    padding:6px; min-width:150px; display:none; z-index:200;
  }
  .dropdown.show{ display:block; animation:fade .2s ease; }
  .dropdown-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:10px;
    cursor:pointer; font-size:14px; color:var(--ink);
    transition:background .15s;
  }
  .dropdown-item:hover{ background:var(--bg); }

  /* ===== 标签 ===== */
  .tabs{ display:flex; justify-content:center; gap:8px; padding:16px 16px 10px; flex-wrap:wrap; }
  .tab-btn{
    display:flex; align-items:center; gap:7px;
    border:1px solid var(--line); border-radius:12px;
    padding:10px 18px; font-size:14px; font-weight:500;
    cursor:pointer; color:var(--ink-soft); background:var(--card);
    transition:all .2s; user-select:none;
  }
  .tab-btn:hover{ color:var(--ink); border-color:var(--primary-2); }
  .tab-btn.active{ color:var(--primary); border-color:var(--primary); background:rgba(108,92,231,.06); }

  main{ max-width:780px; margin:0 auto; padding:8px 16px 24px; }
  .page{ display:none; }
  .page.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* 搜索框 */
  .search-box{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; margin-bottom:14px;
  }
  .search-box input{
    flex:1; border:none; background:transparent;
    font-size:14px; color:var(--ink); outline:none; font-family:inherit;
  }
  .search-box input::placeholder{ color:var(--ink-soft); opacity:.7; }

  /* 添加卡片 */
  .add-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:18px; margin-bottom:18px; box-shadow:0 2px 8px var(--shadow);
  }
  .add-card h2{ font-size:15px; font-weight:600; margin-bottom:12px; color:var(--ink); }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .row > input, .row > textarea{
    flex:1; min-width:120px;
    border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-size:14px; color:var(--ink);
    background:var(--bg); transition:border-color .2s, background .2s; font-family:inherit;
  }
  .row > input:focus, .row > textarea:focus{ outline:none; border-color:var(--primary); background:var(--card); }
  .row > textarea{ resize:vertical; min-height:60px; }

  /* 按钮 */
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:none; border-radius:10px;
    padding:9px 16px; font-size:13px; font-weight:500;
    cursor:pointer; color:#fff; transition:transform .12s, opacity .2s;
  }
  .btn:hover{ opacity:.92; }
  .btn:active{ transform:scale(.97); }
  .btn-add{ background:var(--accent); }
  .btn-edit{ background:var(--warning); color:#5a4500; }
  .btn-open{ background:var(--primary); }
  .btn-copy{ background:var(--primary-2); }
  .btn-del{ background:var(--danger); margin-left:auto; }
  .btn-save{ background:var(--primary); }

  /* 列表项 */
  .list{ display:flex; flex-direction:column; gap:12px; }
  .item{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; box-shadow:0 2px 8px var(--shadow);
  }
  .item-name{ font-size:15px; font-weight:600; margin-bottom:6px; word-break:break-all; color:var(--ink); }
  .item-meta{ font-size:12px; color:var(--ink-soft); margin-bottom:10px; word-break:break-all; }
  .item-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  /* 复制项子项 */
  .copy-list{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .copy-item{
    display:flex; gap:8px; align-items:flex-start;
    background:var(--bg); border-radius:10px; padding:10px 12px;
  }
  .copy-text{ flex:1; white-space:pre-wrap; word-break:break-all; font-size:14px; line-height:1.55; }
  .btn-mini{
    display:inline-flex; align-items:center; gap:4px;
    border:none; border-radius:8px; padding:6px 10px;
    font-size:12px; cursor:pointer; color:#fff; flex-shrink:0;
    background:var(--primary-2); transition:opacity .2s;
  }
  .btn-mini:hover{ opacity:.88; }

  .empty{ text-align:center; padding:40px 16px; color:var(--ink-soft); font-size:14px; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:300;
  }
  .toast.show{ opacity:.95; transform:translateX(-50%) translateY(-4px); }

  /* 复制内容输入区 */
  .copy-input-wrap{
    border:1px dashed var(--line); border-radius:10px;
    padding:10px; margin-top:10px; background:var(--bg);
  }
  .copy-input-wrap > textarea{
    width:100%; border:none; background:transparent; resize:vertical;
    min-height:48px; font-size:14px; color:var(--ink); font-family:inherit;
  }
  .copy-input-wrap > textarea:focus{ outline:none; }
  .copy-add-row{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .copy-add-row .hint{ font-size:12px; color:var(--ink-soft); }
  .add-copy-btn{
    display:inline-flex; align-items:center; gap:4px;
    border:none; border-radius:8px; padding:5px 12px; font-size:12px; cursor:pointer;
    background:var(--primary-2); color:#fff; transition:opacity .2s;
  }
  .add-copy-btn:hover{ opacity:.88; }

  /* 链接预览 */
  .link-preview{
    margin-top:10px; border-radius:10px; overflow:hidden;
    background:var(--bg); border:1px solid var(--line);
  }
  .link-preview img, .link-preview video{ max-width:100%; max-height:340px; display:block; margin:0 auto; }
  .link-preview audio{ width:100%; display:block; }
  .link-preview iframe{ width:100%; height:260px; border:none; display:block; background:#fff; }
  .link-preview .preview-fail{ padding:14px; text-align:center; font-size:13px; color:var(--ink-soft); }
  .link-url{ font-size:12px; color:var(--ink-soft); word-break:break-all; margin-bottom:8px; }

  /* 弹窗 */
  .modal-mask{
    position:fixed; inset:0; background:rgba(0,0,0,.45);
    display:none; align-items:center; justify-content:center;
    padding:20px; z-index:400;
  }
  .modal-mask.show{ display:flex; animation:fade .2s ease; }
  .modal-content{
    background:var(--card); border-radius:18px;
    padding:22px; width:100%; max-width:480px;
    max-height:86vh; overflow-y:auto; box-shadow:0 12px 40px var(--shadow-lg);
  }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-header h3{ font-size:17px; font-weight:600; }
  .modal-close{
    border:none; background:transparent; cursor:pointer;
    color:var(--ink-soft); padding:4px; border-radius:8px;
    display:flex; align-items:center; transition:background .15s;
  }
  .modal-close:hover{ background:var(--bg); color:var(--ink); }

  .edit-row{ display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; }
  .edit-row textarea{
    flex:1; border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; font-size:14px; color:var(--ink);
    background:var(--bg); resize:vertical; min-height:40px; font-family:inherit;
  }
  .edit-row textarea:focus{ outline:none; border-color:var(--primary); }
  .edit-row .btn-mini{ background:var(--danger); }
  .edit-name-input{
    width:100%; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-size:15px; color:var(--ink);
    background:var(--bg); margin-bottom:14px; font-family:inherit;
  }
  .edit-name-input:focus{ outline:none; border-color:var(--primary); }

  /* 装扮主题卡片 */
  .theme-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
  .theme-chip{
    border:1px solid var(--line); border-radius:14px; padding:12px;
    cursor:pointer; transition:transform .12s, border-color .2s; background:var(--bg);
  }
  .theme-chip:hover{ transform:translateY(-2px); }
  .theme-chip.active{ border-color:var(--primary); box-shadow:0 0 0 2px var(--primary); }
  .theme-chip .colors{ display:flex; height:28px; border-radius:8px; overflow:hidden; margin-bottom:8px; }
  .theme-chip .colors span{ flex:1; }
  .theme-chip .tname{ font-size:13px; font-weight:500; text-align:center; }

  /* ===== 开场动画 ===== */
  #introScreen{
    position:fixed; inset:0; z-index:9999;
    background:linear-gradient(135deg, #CFE4DD 0%, #B5DAE9 60%, #EFE4D4 100%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; transition:opacity .5s ease;
  }
  #introScreen.hide{ opacity:0; pointer-events:none; }
  #introCanvas{ display:block; }
  #introAuthor{
    position:absolute;
    bottom:26%;
    left:50%;
    transform:translateX(-50%);
    font-size:15px;
    font-family:"Inter","PingFang SC",sans-serif;
    letter-spacing:3px;
    background:linear-gradient(90deg, #F8819B 0%, #B6A9C8 50%, #63BAD9 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    white-space:nowrap;
    opacity:0;
    transition:opacity .6s ease;
  }
  #introAuthor.show{ opacity:1; }
  #introAuthor .char{
    display:inline-block;
    opacity:0;
    animation:charIn .4s forwards;
  }
  @keyframes charIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  #skipBtn{
    position:absolute; top:16px; right:16px;
    background:rgba(255,255,255,.5); color:#8D6C63;
    border:1px solid rgba(255,255,255,.7); border-radius:999px;
    padding:8px 18px; font-size:13px; cursor:pointer;
    backdrop-filter:blur(8px); transition:background .2s;
  }
  #skipBtn:hover{ background:rgba(255,255,255,.75); }
</style>
</head>
<body>

<!-- 开场动画 -->
<div id="introScreen">
  <canvas id="introCanvas"></canvas>
  <div id="introAuthor"></div>
  <button id="skipBtn">跳过 ›</button>
</div>

<header>
  <button class="top-btn top-left" id="menuBtn" title="菜单">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
  </button>
  <button class="top-btn top-right" id="modeBtn" title="日夜切换">
    <svg class="icon" id="modeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
  <h1 class="font-script">Macaron</h1>
  <p>sites · snippets · links</p>

  <div class="dropdown" id="topMenu">
    <div class="dropdown-item" id="themeMenuItem">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-5.52-4.5-10-10-10z"/><circle cx="6.5" cy="11.5" r="1.3"/><circle cx="9.5" cy="7.5" r="1.3"/><circle cx="14.5" cy="7.5" r="1.3"/><circle cx="17.5" cy="11.5" r="1.3"/></svg>
      装扮
    </div>
    <div class="dropdown-item" id="aboutMenuItem">
      <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
      关于
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" data-page="page1">
    <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
    网站收藏
  </button>
  <button class="tab-btn" data-page="page2">
    <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 2h6l4 4v14H5V2z"/><path d="M9 2v5h5"/></svg>
    复制内容
  </button>
  <button class="tab-btn" data-page="page3">
    <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
    链接收藏
  </button>
</div>

<main>
  <section id="page1" class="page active">
    <div class="search-box">
      <svg class="icon icon-sm" style="color:var(--ink-soft)" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="siteSearch" type="text" placeholder="搜索网站..." />
    </div>
    <div class="add-card">
      <h2>添加网站</h2>
      <div class="row">
        <input id="siteName" type="text" placeholder="备注名字" />
        <input id="siteUrl" type="text" placeholder="网址 https://..." />
      </div>
      <div class="row" style="margin-top:10px; justify-content:flex-end;">
        <button class="btn btn-add" id="addSiteBtn">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          添加
        </button>
      </div>
    </div>
    <div class="list" id="siteList"></div>
    <div class="empty" id="siteEmpty">还没有收藏网站</div>
  </section>

  <section id="page2" class="page">
    <div class="search-box">
      <svg class="icon icon-sm" style="color:var(--ink-soft)" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="copySearch" type="text" placeholder="搜索复制内容..." />
    </div>
    <div class="add-card">
      <h2>添加复制内容</h2>
      <div class="row">
        <input id="copyName" type="text" placeholder="备注名字" />
      </div>
      <div class="copy-input-wrap">
        <textarea id="copyContent" placeholder="输入内容，每条用回车分隔..."></textarea>
        <div class="copy-add-row">
          <span class="hint">每条用回车分隔，可单独复制</span>
          <button class="add-copy-btn" id="addCopyItemBtn">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            添加一行
          </button>
        </div>
      </div>
      <div class="row" style="margin-top:10px; justify-content:flex-end;">
        <button class="btn btn-add" id="addCopyBtn">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
          保存
        </button>
      </div>
    </div>
    <div class="list" id="copyList"></div>
    <div class="empty" id="copyEmpty">还没有复制内容</div>
  </section>

  <section id="page3" class="page">
    <div class="search-box">
      <svg class="icon icon-sm" style="color:var(--ink-soft)" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="linkSearch" type="text" placeholder="搜索链接..." />
    </div>
    <div class="add-card">
      <h2>添加链接</h2>
      <div class="row">
        <input id="linkName" type="text" placeholder="备注名字" />
        <input id="linkUrl" type="text" placeholder="URL（图片/视频/音频/网页）" />
      </div>
      <div class="row" style="margin-top:10px; justify-content:flex-end;">
        <button class="btn btn-add" id="addLinkBtn">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          添加
        </button>
      </div>
    </div>
    <div class="list" id="linkList"></div>
    <div class="empty" id="linkEmpty">还没有收藏链接</div>
  </section>
</main>

<!-- 编辑弹窗 -->
<div class="modal-mask" id="editModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>编辑复制内容</h3>
      <button class="modal-close" id="editClose">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <input class="edit-name-input" id="editName" type="text" placeholder="备注名字" />
    <div id="editRows"></div>
    <div class="row" style="justify-content:flex-end; margin-top:12px;">
      <button class="btn btn-copy" id="editAddRow" style="margin-right:auto;">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        加一行
      </button>
      <button class="btn btn-save" id="editSave">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
        保存
      </button>
    </div>
  </div>
</div>

<!-- 装扮弹窗 -->
<div class="modal-mask" id="themeModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>装扮</h3>
      <button class="modal-close" id="themeClose">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="theme-grid" id="themeGrid"></div>
  </div>
</div>

<!-- 关于弹窗 -->
<div class="modal-mask" id="aboutModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>关于 Macaron</h3>
      <button class="modal-close" id="aboutClose">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p style="line-height:1.8; font-size:14px; color:var(--ink-soft);">
      一个干净的本地收藏工具：<br>
      网站收藏、复制内容、链接收藏（图片/视频/音频自动预览）。<br><br>
      数据保存在浏览器本地，不上传任何服务器，完全私密。<br>
      清除浏览器数据会导致丢失，请定期备份。
    </p>
  </div>
</div>

<div class="toast" id="toast">已复制</div>

<script>
(function(){
  "use strict";

  /* Service Worker */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){});
    });
  }

  /* ===== 颜色工具 ===== */
  function lighten(hex, amt){
    var h = hex.replace("#","");
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    r = Math.round(r+(255-r)*amt); g = Math.round(g+(255-g)*amt); b = Math.round(b+(255-b)*amt);
    return "#"+[r,g,b].map(function(x){return x.toString(16).padStart(2,"0");}).join("");
  }

  /* ===== 主题数据（含语义色） ===== */
  var THEMES = [
    { name:"Macaron", bg:"#F7F8FA", card:"#FFFFFF", ink:"#2D3142", line:"#E8EAED",
      c1:"#6C5CE7", c2:"#A29BFE", c3:"#00B894", c4:"#55EFC4", c5:"#FF7675",
      primary:"#6C5CE7", accent:"#00B894", warning:"#F0A500", danger:"#FF7675", title:"#6C5CE7" },
    { name:"薄荷曼波", bg:"#F9F4EA", card:"#FFFFFF", ink:"#5a4a42", line:"#E8DDD4",
      c1:"#CFE4DD", c2:"#FCD3D5", c3:"#8D6C63", c4:"#CFE4DD", c5:"#F9F4EA",
      primary:"#8D6C63", accent:"#5B8C7E", warning:"#C99A6E", danger:"#C97B7B", title:"#8D6C63" },
    { name:"瓦尔登湖", bg:"#ECF7F4", card:"#FFFFFF", ink:"#2a5a6a", line:"#D4E8E2",
      c1:"#CAEBED", c2:"#63BAD9", c3:"#B5DAE9", c4:"#63BAD9", c5:"#CCE7D9",
      primary:"#2E86AB", accent:"#2A9D8F", warning:"#E8A33D", danger:"#E07A7A", title:"#2E86AB" },
    { name:"美式复古", bg:"#ECF7F4", card:"#FFFFFF", ink:"#8D6C63", line:"#D4E8E2",
      c1:"#CAEBED", c2:"#63BAD9", c3:"#B5DAE9", c4:"#8D6C63", c5:"#CCE7D9",
      primary:"#8D6C63", accent:"#2E86AB", warning:"#E8A33D", danger:"#C97B7B", title:"#8D6C63" },
    { name:"先帝最爱", bg:"#EFE4D4", card:"#FFFFFF", ink:"#6B4550", line:"#E0D2C2",
      c1:"#F5C7C9", c2:"#F8819B", c3:"#B9D9EA", c4:"#F8819B", c5:"#EFE4D4",
      primary:"#D85C7B", accent:"#4A9BC4", warning:"#D9A441", danger:"#C95353", title:"#D85C7B" },
    { name:"青提芭乐", bg:"#F6FCE8", card:"#FFFFFF", ink:"#5a4a3a", line:"#E0E8CC",
      c1:"#FED0D6", c2:"#FF82A2", c3:"#BDDE93", c4:"#FF82A2", c5:"#E4F6A9",
      primary:"#E05580", accent:"#6BA84F", warning:"#D9A441", danger:"#C95353", title:"#E05580" },
    { name:"椰风海岛", bg:"#E8F0F8", card:"#FFFFFF", ink:"#1a4a7a", line:"#D4E0EC",
      c1:"#95B4E0", c2:"#225DAB", c3:"#CADEC3", c4:"#225DAB", c5:"#CBAF98",
      primary:"#225DAB", accent:"#2E8B57", warning:"#D9A441", danger:"#C95353", title:"#225DAB" },
    { name:"浮光跃金", bg:"#F5F1E4", card:"#FFFFFF", ink:"#4a4535", line:"#E0D8C8",
      c1:"#C8D4C0", c2:"#F1D996", c3:"#799B84", c4:"#B69F8A", c5:"#C8D4C0",
      primary:"#5A7A68", accent:"#B8860B", warning:"#C9A24A", danger:"#B87070", title:"#5A7A68" },
    { name:"橘子汽水", bg:"#FFF8E8", card:"#FFFFFF", ink:"#5a3a1a", line:"#F0E0B8",
      c1:"#FE8F29", c2:"#FAE593", c3:"#849C4D", c4:"#C5863C", c5:"#FAE593",
      primary:"#E07A1A", accent:"#6B8040", warning:"#C5863C", danger:"#C95353", title:"#E07A1A" },
    { name:"海盐葡萄", bg:"#EFE4D4", card:"#FFFFFF", ink:"#302B58", line:"#DCD0E0",
      c1:"#B6A9C8", c2:"#302B58", c3:"#9078AC", c4:"#9078AC", c5:"#EFE4D4",
      primary:"#302B58", accent:"#7A5FA0", warning:"#C9A24A", danger:"#A05060", title:"#302B58" }
  ];

  /* 数据层 */
  var KEY_SITES="tian_sites_v1", KEY_COPIES="tian_copies_v1", KEY_LINKS="tian_links_v1";
  var KEY_THEME="tian_theme_v1", KEY_MODE="tian_mode_v1";
  function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
  function save(k,d){ localStorage.setItem(k, JSON.stringify(d)); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  var sites=load(KEY_SITES)||[], copies=load(KEY_COPIES)||[], links=load(KEY_LINKS)||[];

  /* 主题应用（联动所有语义色） */
  var currentTheme = load(KEY_THEME) || "Macaron";
  function applyTheme(name){
    var t = THEMES.find(function(x){ return x.name===name; }) || THEMES[0];
    var r = document.documentElement.style;
    r.setProperty("--bg",t.bg); r.setProperty("--card",t.card);
    r.setProperty("--ink",t.ink); r.setProperty("--line",t.line);
    r.setProperty("--c1",t.c1); r.setProperty("--c2",t.c2);
    r.setProperty("--c3",t.c3); r.setProperty("--c4",t.c4); r.setProperty("--c5",t.c5);
    // 语义色 + 浅色版本
    r.setProperty("--primary",t.primary);    r.setProperty("--primary-2",lighten(t.primary,.4));
    r.setProperty("--accent",t.accent);      r.setProperty("--accent-2",lighten(t.accent,.4));
    r.setProperty("--warning",t.warning);    r.setProperty("--warning-2",lighten(t.warning,.4));
    r.setProperty("--danger",t.danger);      r.setProperty("--danger-2",lighten(t.danger,.4));
    r.setProperty("--title",t.title);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", t.primary);
    currentTheme = t.name; save(KEY_THEME, t.name);
  }
  applyTheme(currentTheme);

  /* 日夜模式 */
  var currentMode = load(KEY_MODE) || "light";
  var ICON_SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
  var ICON_MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
  function applyMode(mode){
    currentMode = mode;
    document.body.classList.toggle("dark", mode==="dark");
    document.getElementById("modeIcon").innerHTML = mode==="dark" ? ICON_MOON : ICON_SUN;
    save(KEY_MODE, mode);
  }
  applyMode(currentMode);

  /* DOM 辅助 */
  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s==null?"":s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function toast(msg){
    var t=$("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(t._timer);
    t._timer=setTimeout(function(){ t.classList.remove("show"); },1400);
  }
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast("已复制"); })
        .catch(function(){ fallbackCopy(text); });
    }else{ fallbackCopy(text); }
  }
  function fallbackCopy(text){
    var ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.left="-9999px";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("已复制"); }
    catch(e){ toast("复制失败"); }
    document.body.removeChild(ta);
  }
  function openSite(url){
    try{
      if(url && !/^https?:\/\//i.test(url) && !/^mailto:|^tel:/i.test(url)) url="https://"+url;
      window.open(url,"_blank");
    }catch(e){ window.location.href=url; }
  }
  function detectLinkType(url){
    var u=(url||"").toLowerCase().split("?")[0].split("#")[0];
    if(/\.(png|jpe?g|gif|webp|bmp|svg|ico|avif)(\?|$)/.test(u)) return "image";
    if(/\.(mp4|webm|ogg|mov|m4v)(\?|$)/.test(u)) return "video";
    if(/\.(mp3|wav|flac|aac|m4a|ogg|opus)(\?|$)/.test(u)) return "audio";
    return "iframe";
  }
  function matchItem(data, query){
    if(!query) return true;
    return JSON.stringify(data).toLowerCase().indexOf(query.toLowerCase()) >= 0;
  }

  /* 页面切换 */
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      var target=btn.getAttribute("data-page");
      document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
      $(target).classList.add("active");
    });
  });

  /* 顶部菜单 */
  $("menuBtn").addEventListener("click", function(e){
    e.stopPropagation();
    $("topMenu").classList.toggle("show");
  });
  document.addEventListener("click", function(){ $("topMenu").classList.remove("show"); });
  $("themeMenuItem").addEventListener("click", function(){
    $("topMenu").classList.remove("show"); openThemeModal();
  });
  $("aboutMenuItem").addEventListener("click", function(){
    $("topMenu").classList.remove("show");
    $("aboutModal").classList.add("show");
  });
  $("modeBtn").addEventListener("click", function(){
    applyMode(currentMode==="dark" ? "light" : "dark");
  });

  /* 装扮弹窗 */
  function openThemeModal(){
    var grid=$("themeGrid"); grid.innerHTML="";
    THEMES.forEach(function(t){
      var chip=document.createElement("div");
      chip.className="theme-chip"+(t.name===currentTheme?" active":"");
      chip.innerHTML=
        '<div class="colors">'+
          '<span style="background:'+t.primary+'"></span>'+
          '<span style="background:'+t.accent+'"></span>'+
          '<span style="background:'+t.warning+'"></span>'+
          '<span style="background:'+t.danger+'"></span>'+
        '</div>'+
        '<div class="tname">'+esc(t.name)+'</div>';
      chip.addEventListener("click", function(){
        applyTheme(t.name);
        document.querySelectorAll(".theme-chip").forEach(function(c){ c.classList.remove("active"); });
        chip.classList.add("active");
        toast("装扮已切换");
      });
      grid.appendChild(chip);
    });
    $("themeModal").classList.add("show");
  }

  /* 弹窗关闭 */
  ["editClose","themeClose","aboutClose"].forEach(function(id){
    $(id).addEventListener("click", function(){ $(id).closest(".modal-mask").classList.remove("show"); });
  });
  document.querySelectorAll(".modal-mask").forEach(function(m){
    m.addEventListener("click", function(e){ if(e.target===m) m.classList.remove("show"); });
  });

  /* ===== 页面一：网站收藏 ===== */
  function renderSites(){
    var list=$("siteList"); list.innerHTML="";
    var q=$("siteSearch").value.trim();
    var shown=sites.filter(function(s){ return matchItem(s,q); });
    $("siteEmpty").style.display=shown.length?"none":"block";
    shown.forEach(function(s){
      var div=document.createElement("div");
      div.className="item";
      div.innerHTML=
        '<div class="item-name">'+esc(s.name)+'</div>'+
        '<div class="item-meta">'+esc(s.url)+'</div>'+
        '<div class="item-actions">'+
          '<button class="btn btn-open" data-act="open">'+
            '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>打开</button>'+
          '<button class="btn btn-del" data-act="del">'+
            '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>删除</button>'+
        '</div>';
      div.querySelector('[data-act="open"]').addEventListener("click", function(){ openSite(s.url); });
      div.querySelector('[data-act="del"]').addEventListener("click", function(){
        if(confirm("删除「"+s.name+"」？")){
          sites=sites.filter(function(x){ return x.id!==s.id; });
          save(KEY_SITES,sites); renderSites(); toast("已删除");
        }
      });
      list.appendChild(div);
    });
  }
  $("siteSearch").addEventListener("input", renderSites);
  $("addSiteBtn").addEventListener("click", function(){
    var name=$("siteName").value.trim(), url=$("siteUrl").value.trim();
    if(!name){ toast("请填写备注名字"); $("siteName").focus(); return; }
    if(!url){ toast("请填写网址"); $("siteUrl").focus(); return; }
    sites.push({ id:uid(), name:name, url:url });
    save(KEY_SITES,sites);
    $("siteName").value=""; $("siteUrl").value="";
    renderSites(); toast("已添加");
  });

  /* ===== 页面二：复制内容 ===== */
  function renderCopies(){
    var list=$("copyList"); list.innerHTML="";
    var q=$("copySearch").value.trim();
    var shown=copies.filter(function(c){ return matchItem(c,q); });
    $("copyEmpty").style.display=shown.length?"none":"block";
    shown.forEach(function(c){
      var div=document.createElement("div");
      div.className="item";
      var itemsHtml="";
      (c.items||[]).forEach(function(item,idx){
        itemsHtml+=
          '<div class="copy-item">'+
            '<div class="copy-text">'+esc(item)+'</div>'+
            '<button class="btn-mini" data-cidx="'+idx+'">'+
              '<svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</button>'+
          '</div>';
      });
      if(!itemsHtml) itemsHtml='<div class="item-meta">（暂无内容）</div>';
      div.innerHTML=
        '<div class="item-name">'+esc(c.name)+'</div>'+
        '<div class="copy-list">'+itemsHtml+'</div>'+
        '<div class="item-actions" style="margin-top:8px;">'+
          '<button class="btn btn-edit" data-act="edit">'+
            '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>编辑</button>'+
          '<button class="btn btn-del" data-act="del">'+
            '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>删除</button>'+
        '</div>';
      div.querySelectorAll(".btn-mini").forEach(function(b){
        b.addEventListener("click", function(){
          var idx=parseInt(b.getAttribute("data-cidx"),10);
          copyText(c.items[idx]);
        });
      });
      div.querySelector('[data-act="edit"]').addEventListener("click", function(){ openEditModal(c.id); });
      div.querySelector('[data-act="del"]').addEventListener("click", function(){
        if(confirm("删除「"+c.name+"」？")){
          copies=copies.filter(function(x){ return x.id!==c.id; });
          save(KEY_COPIES,copies); renderCopies(); toast("已删除");
        }
      });
      list.appendChild(div);
    });
  }
  $("copySearch").addEventListener("input", renderCopies);
  $("addCopyBtn").addEventListener("click", function(){
    var name=$("copyName").value.trim(), content=$("copyContent").value;
    if(!name){ toast("请填写备注名字"); $("copyName").focus(); return; }
    if(!content.trim()){ toast("请填写内容"); $("copyContent").focus(); return; }
    var items=content.split(/\r?\n/).filter(function(s){ return s.trim()!==""; });
    if(items.length===0){ toast("没有有效内容"); return; }
    copies.push({ id:uid(), name:name, items:items });
    save(KEY_COPIES,copies);
    $("copyName").value=""; $("copyContent").value="";
    renderCopies(); toast("已保存");
  });
  $("addCopyItemBtn").addEventListener("click", function(){
    var ta=$("copyContent");
    if(ta.value && !ta.value.endsWith("\n")) ta.value+="\n";
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  });

  /* 编辑弹窗 */
  var editingId=null;
  function openEditModal(id){
    var c=copies.find(function(x){ return x.id===id; });
    if(!c) return;
    editingId=id;
    $("editName").value=c.name;
    var rows=$("editRows"); rows.innerHTML="";
    (c.items||[]).forEach(function(txt){ addEditRow(txt); });
    if(rows.children.length===0) addEditRow("");
    $("editModal").classList.add("show");
  }
  function addEditRow(text){
    var wrap=document.createElement("div");
    wrap.className="edit-row";
    wrap.innerHTML='<textarea></textarea><button class="btn-mini" title="删除此行"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';
    wrap.querySelector("textarea").value=text||"";
    wrap.querySelector(".btn-mini").addEventListener("click", function(){ wrap.remove(); });
    $("editRows").appendChild(wrap);
  }
  $("editAddRow").addEventListener("click", function(){ addEditRow(""); });
  $("editSave").addEventListener("click", function(){
    var name=$("editName").value.trim();
    if(!name){ toast("请填写备注名字"); return; }
    var items=[];
    $("editRows").querySelectorAll("textarea").forEach(function(ta){
      if(ta.value.trim()!=="") items.push(ta.value);
    });
    if(items.length===0){ toast("至少保留一条内容"); return; }
    var idx=copies.findIndex(function(x){ return x.id===editingId; });
    if(idx>=0){
      copies[idx].name=name; copies[idx].items=items;
      save(KEY_COPIES,copies); renderCopies();
      $("editModal").classList.remove("show");
      toast("已更新");
    }
  });

  /* ===== 页面三：链接收藏 ===== */
  function renderLinks(){
    var list=$("linkList"); list.innerHTML="";
    var q=$("linkSearch").value.trim();
    var shown=links.filter(function(l){ return matchItem(l,q); });
    $("linkEmpty").style.display=shown.length?"none":"block";
    shown.forEach(function(l){
      var div=document.createElement("div");
      div.className="item";
      var type=detectLinkType(l.url);
      var previewHtml="";
      if(type==="image"){
        previewHtml='<img src="'+esc(l.url)+'" alt="预览" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">'+
                     '<div class="preview-fail" style="display:none;">图片加载失败，请点击链接查看</div>';
      }else if(type==="video"){
        previewHtml='<video src="'+esc(l.url)+'" controls preload="metadata"></video>';
      }else if(type==="audio"){
        previewHtml='<audio src="'+esc(l.url)+'" controls preload="metadata"></audio>';
      }else{
        previewHtml='<iframe src="'+esc(l.url)+'" sandbox="allow-scripts allow-same-origin" loading="lazy" '+
                     'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"></iframe>'+
                     '<div class="preview-fail" style="display:none;">该网页禁止嵌入预览，请点击打开</div>';
      }
      div.innerHTML=
        '<div class="item-name">'+esc(l.name)+'</div>'+
        '<div class="link-url">'+esc(l.url)+'</div>'+
        '<div class="item-actions">'+
          '<button class="btn btn-copy" data-act="copy">'+
            '<svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制链接</button>'+
          '<button class="btn btn-open" data-act="open">'+
            '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>打开</button>'+
          '<button class="btn btn-del" data-act="del">'+
            '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>删除</button>'+
        '</div>'+
        '<div class="link-preview">'+previewHtml+'</div>';
      div.querySelector('[data-act="copy"]').addEventListener("click", function(){ copyText(l.url); });
      div.querySelector('[data-act="open"]').addEventListener("click", function(){ openSite(l.url); });
      div.querySelector('[data-act="del"]').addEventListener("click", function(){
        if(confirm("删除「"+l.name+"」？")){
          links=links.filter(function(x){ return x.id!==l.id; });
          save(KEY_LINKS,links); renderLinks(); toast("已删除");
        }
      });
      list.appendChild(div);
    });
  }
  $("linkSearch").addEventListener("input", renderLinks);
  $("addLinkBtn").addEventListener("click", function(){
    var name=$("linkName").value.trim(), url=$("linkUrl").value.trim();
    if(!name){ toast("请填写备注名字"); $("linkName").focus(); return; }
    if(!url){ toast("请填写 URL"); $("linkUrl").focus(); return; }
    links.push({ id:uid(), name:name, url:url });
    save(KEY_LINKS,links);
    $("linkName").value=""; $("linkUrl").value="";
    renderLinks(); toast("已添加");
  });

  /* ===== 开场动画：波点组成 Macaron 文字，碰撞散开 ===== */
  (function initIntro(){
    var screen = document.getElementById("introScreen");
    var canvas = document.getElementById("introCanvas");
    var skip = document.getElementById("skipBtn");
    if(!screen || !canvas) return;
    var ctx = canvas.getContext("2d");
    var cw, ch, dpr = window.devicePixelRatio || 1;

    function resize(){
      cw = window.innerWidth; ch = window.innerHeight;
      canvas.width = cw * dpr; canvas.height = ch * dpr;
      canvas.style.width = cw + "px"; canvas.style.height = ch + "px";
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    resize();
    window.addEventListener("resize", resize);

    // 获取文字像素点
    function getTextPoints(text){
      var off = document.createElement("canvas");
      var octx = off.getContext("2d");
      var fontSize = Math.min(cw * 0.18, 160);
      octx.font = 'bold ' + fontSize + 'px Pacifico, cursive';
      var tw = octx.measureText(text).width + 60;
      off.width = tw; off.height = fontSize + 60;
      octx.font = 'bold ' + fontSize + 'px Pacifico, cursive';
      octx.textBaseline = "middle";
      octx.fillStyle = "#fff";
      octx.fillText(text, 30, off.height/2);
      var data = octx.getImageData(0,0,off.width,off.height).data;
      var pts = [];
      var step = Math.max(5, Math.round(fontSize/22));
      for(var y=0; y<off.height; y+=step){
        for(var x=0; x<off.width; x+=step){
          if(data[(y*off.width+x)*4+3] > 128){
            pts.push({ x: x - off.width/2, y: y - off.height/2 });
          }
        }
      }
      return pts;
    }

    var targets = getTextPoints("Macaron");
    // 波点以白色为主（组成白色文字），少量马卡龙色点缀
    var colors = ["#ffffff","#ffffff","#ffffff","#ffffff","#ffffff","#ffffff","#FCD3D5","#F1D996"];
    var particles = targets.map(function(p){
      var angle = Math.random() * Math.PI * 2;
      var dist = Math.max(cw, ch) * (0.6 + Math.random()*0.5);
      return {
        x: cw/2 + Math.cos(angle)*dist,
        y: ch/2 + Math.sin(angle)*dist,
        tx: cw/2 + p.x,
        ty: ch/2 + p.y,
        vx: 0, vy: 0,
        r: 1.8 + Math.random()*1.6,
        color: colors[Math.floor(Math.random()*colors.length)]
      };
    });

    var phase = "gather";   // gather -> hold -> author -> done
    var phaseFrame = 0;
    var raf = null;
    var finished = false;
    var authorEl = document.getElementById("introAuthor");
    var authorShown = false;

    function showAuthor(){
      if(authorShown || !authorEl) return;
      authorShown = true;
      var text = "—— Fnkai";
      authorEl.innerHTML = "";
      authorEl.classList.add("show");
      for(var i=0; i<text.length; i++){
        (function(ch, idx){
          var span = document.createElement("span");
          span.className = "char";
          span.textContent = ch === " " ? "\u00A0" : ch;
          span.style.animationDelay = (idx * 0.08) + "s";
          authorEl.appendChild(span);
        })(text[i], i);
      }
    }

    function finish(){
      if(finished) return;
      finished = true;
      if(raf) cancelAnimationFrame(raf);
      screen.classList.add("hide");
      setTimeout(function(){ if(screen.parentNode) screen.parentNode.removeChild(screen); }, 600);
    }

    function step(){
      ctx.clearRect(0,0,cw,ch);
      phaseFrame++;

      particles.forEach(function(p){
        if(phase === "gather"){
          p.x += (p.tx - p.x) * 0.07;
          p.y += (p.ty - p.y) * 0.07;
        } else if(phase === "hold"){
          p.x = p.tx + (Math.random()-0.5)*1.0;
          p.y = p.ty + (Math.random()-0.5)*1.0;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });

      // 阶段切换
      if(phase === "gather" && phaseFrame > 90){ phase = "hold"; phaseFrame = 0; }
      else if(phase === "hold" && phaseFrame === 10){ showAuthor(); }
      else if(phase === "hold" && phaseFrame > 130){ finish(); return; }

      raf = requestAnimationFrame(step);
    }

    skip.addEventListener("click", finish);
    step();
  })();

  /* 初始渲染 */
  renderSites(); renderCopies(); renderLinks();
})();
</script>
